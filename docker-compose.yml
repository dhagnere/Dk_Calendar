services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - '4000:4000'
    environment:
      MONGODB_URI: mongodb://mongo:27017/dk_calendar
      JWT_SECRET: ${JWT_SECRET:-changez-moi-en-production}
      CLIENT_ORIGIN: http://localhost:4000
      PORT: 4000
      NODE_ENV: production

volumes:
  mongo_data:
