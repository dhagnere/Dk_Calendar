# Compose de PRODUCTION pour les serveurs de la CUD — voir docs/DEPLOIEMENT-CUD.md pour la
# procédure complète (première installation, seed des données, mises à jour ultérieures).
#
# Différences volontaires avec docker-compose.yml (celui-ci sert uniquement à un test local rapide
# « à la prod », pas à un vrai déploiement) :
# - PostgreSQL n'expose aucun port sur l'hôte : uniquement accessible depuis le conteneur "app" via
#   le réseau Docker interne. Pour un dump/restore ponctuel, publier temporairement le port en local
#   uniquement (voir plus bas), jamais en écoute sur toutes les interfaces.
# - Les secrets (JWT_SECRET, POSTGRES_PASSWORD, SMTP, etc.) viennent d'un fichier .env à la racine (voir
#   .env.prod.example), jamais écrits en clair ici.
# - restart: always (plutôt que unless-stopped) : redémarre aussi après un reboot du serveur.

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: dk_calendar
      POSTGRES_USER: dk_calendar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être renseigné dans .env}
    # Pour un dump/restore ponctuel depuis le serveur lui-même, ajoutez temporairement ici :
    # ports: ["127.0.0.1:5432:5432"] (jamais "5432:5432" seul, qui écoute sur toutes les interfaces
    # réseau du serveur) — puis retirez la ligne une fois terminé.
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dk_calendar -d dk_calendar']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://dk_calendar:${POSTGRES_PASSWORD}@postgres:5432/dk_calendar
      PORT: 4000
      NODE_ENV: production

volumes:
  pg_data:
